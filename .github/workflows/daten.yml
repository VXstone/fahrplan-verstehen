name: Daten und Seite

# Baut die Jahresdaten (HRDF über VXstone/NGE-fahrplan) und veröffentlicht die Seite auf GitHub Pages.
# - Release "daten": fahrplan.json.gz + stand.json (auch zum lokalen Testen)
# - GitHub Pages: web/ samt web/data/ (nur vom Branch main)
on:
  schedule:
    - cron: "41 4 * * 3,6"        # mittwochs und samstags (HRDF erscheint Di/Fr)
  workflow_dispatch:
    inputs:
      year:
        description: "Fahrplanjahr (leer = aktuelles, im Dezember das nächste)"
        required: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daten-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: VXstone/NGE-fahrplan
          path: lib/nge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HRDF holen und alle Bahnfahrten des Jahres herausschneiden
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.year }}" ]; then ARGS="--year ${{ inputs.year }}"; fi
          python lib/nge/tools/fahrplandaten.py roh $ARGS
      - name: Jahresdaten für die Seite bauen
        run: python tools/build_data.py --nge lib/nge --roh roh --out web/data
      - name: Publikation (grafische Fahrpläne SBB) aufbereiten
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAHR=$(python -c "import gzip,json;print(json.load(gzip.open('web/data/fahrplan.json.gz','rt'))['meta']['end'][:4])")
          gh release download grafapla-$JAHR -R VXstone/NGE-fahrplan -p "grafapla_${JAHR}_zuege.json.gz" -D roh --clobber
          gh release download fahrplandaten -R VXstone/NGE-fahrplan -p stations.csv -D roh --clobber
          python tools/build_pub.py --zuege roh/grafapla_${JAHR}_zuege.json.gz --fahrplan web/data/fahrplan.json.gz \
            --stations roh/stations.csv --out web/data
      - name: Güterzug-Liste (Mo–So, Muster, Achse)
        continue-on-error: true
        run: |
          pip install --quiet openpyxl
          python tools/gz_list.py --pub web/data/publikation.json.gz --fahrplan web/data/fahrplan.json.gz \
            --nge lib/nge --out web/data
      - name: Release "daten" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view daten >/dev/null 2>&1 || \
            gh release create daten --title "Fahrplandaten (automatisch)" \
              --notes "Wird vom Workflow 'Daten und Seite' erzeugt. Siehe stand.json." --target "${{ github.sha }}"
          gh release upload daten web/data/fahrplan.json.gz web/data/stand.json --clobber
          if [ -s web/data/publikation.json.gz ]; then gh release upload daten web/data/publikation.json.gz --clobber; fi
          for f in gueterzuege.json gueterzuege.csv gueterzuege.xlsx; do
            if [ -s web/data/$f ]; then gh release upload daten web/data/$f --clobber; fi
          done
          ls -la web/data
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web

  veroeffentlichen:
    needs: bauen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
