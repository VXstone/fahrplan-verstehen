name: Daten und Seite

# Baut die Jahresdaten (HRDF über VXstone/NGE-fahrplan) und veröffentlicht die Seite auf GitHub Pages.
# - Release "daten": fahrplan.json.gz + stand.json (auch zum lokalen Testen)
# - GitHub Pages: web/ samt web/data/ (nur vom Branch main)
on:
  schedule:
    - cron: "41 4 * * 3,6"        # mittwochs und samstags (HRDF erscheint Di/Fr)
  workflow_dispatch:
    inputs:
      year:
        description: "Fahrplanjahr (leer = aktuelles, im Dezember das nächste)"
        required: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daten-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: VXstone/NGE-fahrplan
          path: lib/nge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HRDF holen und alle Bahnfahrten des Jahres herausschneiden
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.year }}" ]; then ARGS="--year ${{ inputs.year }}"; fi
          python lib/nge/tools/fahrplandaten.py roh $ARGS
      - name: Gleisnetz aus topo-daten (OSM) für vermutete Durchfahrten
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download daten -R VXstone/topo-daten -p schweiz_bahn.json.gz -D roh --clobber
      - name: Jahresdaten für die Seite bauen
        run: |
          ARGS=""
          if [ -s roh/schweiz_bahn.json.gz ]; then ARGS="--netz roh/schweiz_bahn.json.gz"; fi
          python tools/build_data.py --nge lib/nge --roh roh --out web/data $ARGS
      - name: Publikation (grafische Fahrpläne SBB) aufbereiten
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAHR=$(python -c "import gzip,json;print(json.load(gzip.open('web/data/fahrplan.json.gz','rt'))['meta']['end'][:4])")
          gh release download grafapla-$JAHR -R VXstone/NGE-fahrplan -p "grafapla_${JAHR}_zuege.json.gz" -D roh --clobber
          gh release download fahrplandaten -R VXstone/NGE-fahrplan -p stations.csv -D roh --clobber
          python tools/build_pub.py --zuege roh/grafapla_${JAHR}_zuege.json.gz --fahrplan web/data/fahrplan.json.gz \
            --stations roh/stations.csv --out web/data
      - name: Weg je Zug aus der Publikation (Grundgerüst für vermutete Durchfahrten)
        continue-on-error: true
        run: |
          if [ -s web/data/publikation.json.gz ]; then
            python tools/pub_wege.py --fahrplan web/data/fahrplan.json.gz --pub web/data/publikation.json.gz
          fi
      - name: Güterzug-Liste (Mo–So, Muster, Achse)
        continue-on-error: true
        run: |
          pip install --quiet openpyxl
          python tools/gz_list.py --pub web/data/publikation.json.gz --fahrplan web/data/fahrplan.json.gz \
            --nge lib/nge --out web/data
      - name: topo-daten (nur lesen) – Regionstopologien
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: VXstone/topo-daten
          path: lib/topo
          sparse-checkout: spurplan/werkstatt
      - name: topo-daten Ast ergebnisse (Regionen MOB, SZU, Vereina …)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: VXstone/topo-daten
          ref: ergebnisse
          path: lib/topo-erg
          sparse-checkout: ergebnisse
      - name: Gleiszahlen aus topo-daten
        continue-on-error: true
        run: |
          mkdir -p roh/topo
          # je Region nur die Datei, deren Name zum Ordner passt (werkstatt/olten/olten_…, nicht Kopien anderer Regionen)
          for f in lib/topo/spurplan/werkstatt/*/*_region_topologie.json lib/topo-erg/ergebnisse/region_*/*_region_topologie.json; do
            [ -f "$f" ] || continue
            d=$(basename "$(dirname "$f")"); d=${d#region_}
            if [ "$(basename "$f")" = "${d}_region_topologie.json" ]; then cp "$f" roh/topo/; fi
          done
          ls roh/topo
          printf '{"main":"%s","ergebnisse":"%s"}' "$(git -C lib/topo rev-parse --short HEAD)" "$(git -C lib/topo-erg rev-parse --short HEAD)" > roh/topo_stand.json
          ARGS=""
          if [ -s web/data/publikation.json.gz ]; then ARGS="--pub web/data/publikation.json.gz"; fi
          python tools/build_gleise.py --topo roh/topo --fahrplan web/data/fahrplan.json.gz $ARGS \
            --stand roh/topo_stand.json --out web/data
      - name: Release "daten" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view daten >/dev/null 2>&1 || \
            gh release create daten --title "Fahrplandaten (automatisch)" \
              --notes "Wird vom Workflow 'Daten und Seite' erzeugt. Siehe stand.json." --target "${{ github.sha }}"
          gh release upload daten web/data/fahrplan.json.gz web/data/stand.json --clobber
          if [ -s web/data/publikation.json.gz ]; then gh release upload daten web/data/publikation.json.gz --clobber; fi
          for f in gueterzuege.json gueterzuege.csv gueterzuege.xlsx gleise.json gueterabschnitte.csv; do
            if [ -s web/data/$f ]; then gh release upload daten web/data/$f --clobber; fi
          done
          ls -la web/data
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web

  veroeffentlichen:
    needs: bauen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
